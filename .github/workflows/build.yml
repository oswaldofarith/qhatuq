name: Build plugin ZIP

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Build ZIP
        run: bin/build-zip.sh

      # GitHub comprime el artefacto al descargarlo. Se sube la carpeta build/,
      # que contiene solo qhatuq/, para que el ZIP descargado sea directamente
      # el plugin (qhatuq/qhatuq.php) y no un ZIP dentro de otro.
      - uses: actions/upload-artifact@v4
        with:
          name: qhatuq-plugin
          path: build/
          include-hidden-files: false

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/qhatuq.zip
